name: Build and deploy academic website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run lint:prettier
      - name: Audit al-folio configuration
        run: bundle exec al-folio upgrade audit --no-fail
      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl ""
      - name: Verify generated pages
        run: |
          test -s _site/index.html
          test -s _site/research/index.html
          test -s _site/publications/index.html
          test -s _site/cv/index.html
          test -s _site/assets/css/main.css
          test -s _site/assets/css/tailwind.css
          ! grep -q "Albert Einstein" _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
