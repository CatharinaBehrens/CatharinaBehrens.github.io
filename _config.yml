locale: en-US
site_theme: default
title: Catharina Behrens
name: Catharina Behrens
title_separator: '|'
description: 'Catharina Behrens — PhD candidate in Economics. Research interests:
  Labor, Gender, and Fertility.'
url: https://catharinabehrens.github.io
baseurl: ''
repository: CatharinaBehrens/CatharinaBehrens.github.io
author:
  name: Catharina Behrens
  bio: PhD candidate in Economics
  location: Berlin, Germany
  employer: RFBerlin · Humboldt-Universität zu Berlin
breadcrumbs: false
words_per_minute: 160
read_more: disabled
talkmap_link: false
comments:
  provider: null
atom_feed:
  hide: true
include:
- _pages
exclude:
- Gemfile
- Gemfile.lock
- LICENSE
- README.md
- vendor
- node_modules
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
lsi: false
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: single
    author_profile: true
    comments: false
    share: false
    read_time: false
sass:
  sass_dir: _sass
  style: compressed
timezone: Europe/Berlin
plugins:
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
compress_html:
  clippings: all
  comments:
  - '<!-- '
  - ' -->'
  ignore:
    envs: development
